# Render blueprint. With this file in the repo you can pick "New > Blueprint"
# in Render and it fills in every setting below automatically.
services:
  - type: web
    name: securedesk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render generates these once and keeps them. Do not change them later --
      # rotating the keys signs everybody out and makes old cookies unreadable.
      - key: JWT_SECRET
        generateValue: true
      - key: PREFS_KEY
        generateValue: true
