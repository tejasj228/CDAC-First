<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The vault dial from the wordmark. Colours are fixed here because a
       favicon has no access to the page's CSS variables. -->
  <rect width="32" height="32" rx="7" fill="#0B1214" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#243437" stroke-width="2" />
  <circle
    cx="16"
    cy="16"
    r="9.5"
    fill="none"
    stroke="#E0A94B"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="1.6 5.35"
  />
  <circle cx="16" cy="16" r="3.2" fill="#E0A94B" />
</svg>
